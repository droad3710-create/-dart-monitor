name: OpenDART 자동차 부품 공시 수집

on:
  push:
    paths:
      - '.github/workflows/dart-monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write

concurrency:
  group: dart-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 공시 목록과 원문 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import zipfile
          from html.parser import HTMLParser
          from datetime import datetime, timedelta
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import urlopen
          from xml.etree import ElementTree
          from zoneinfo import ZoneInfo

          key = os.environ.get("DART_API_KEY", "").strip()
          if not key:
              raise SystemExit("DART_API_KEY 비밀값을 등록하세요.")

          def request(endpoint, **params):
              query = urlencode({"crtfc_key": key, **params})
              try:
                  with urlopen("https://opendart.fss.or.kr/api/" + endpoint + "?" + query, timeout=30) as response:
                      return response.read()
              except Exception:
                  raise RuntimeError(f"OpenDART {endpoint} 요청 실패") from None

          class DisclosureTextParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.fragments = []

              def handle_data(self, data):
                  self.fragments.append(data)

          def extract_text(payload):
              try:
                  return " ".join(ElementTree.fromstring(payload).itertext())
              except (ElementTree.ParseError, ValueError):
                  # Some DART originals use HTML-style, unbalanced tags.
                  declaration = re.search(br'encoding=["\x27]([^"\x27]+)', payload[:250], re.I)
                  encoding = declaration.group(1).decode("ascii") if declaration else "utf-8"
                  try:
                      document = payload.decode(encoding)
                  except (UnicodeDecodeError, LookupError):
                      document = payload.decode("cp949")
                  parser = DisclosureTextParser()
                  parser.feed(document)
                  parser.close()
                  text = " ".join(parser.fragments)
                  if not text.strip():
                      raise ValueError("공시 원문에서 본문을 추출하지 못했습니다.")
                  return text

          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          date_args = {
              "bgn_de": (today - timedelta(days=3)).strftime("%Y%m%d"),
              "end_de": today.strftime("%Y%m%d"),
              "page_count": 100,
          }
          tracked = {
              "현대자동차", "기아", "현대모비스", "현대위아", "현대공업",
              "HL만도", "화신", "서연이화", "디와이덕양", "디와이피", "DYP",
              "아진전자부품", "대동기어", "경창산업", "지엠비코리아", "에스엘",
              "텔레칩스", "넥스트칩", "LX세미콘", "글로벌테크놀로지",
              "쓰리에이로직스", "LG에너지솔루션", "삼성SDI", "포스코퓨처엠",
          }
          title_match = re.compile(r"공급계약|기타경영사항|사업보고서|반기보고서|분기보고서")
          parties = re.compile(r"현대자동차|현대차|기아자동차|기아\s*(?:주식회사|㈜)|현대모비스|현대트랜시스|제네시스")
          topics = re.compile(r"수주|납품|공급|신규\s*개발|주요\s*고객|생산\s*시설|양산")
